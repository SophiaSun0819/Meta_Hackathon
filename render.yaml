services:
  - type: web
    name: thinking-space-transcription
    runtime: python
    plan: starter
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: OPENAI_API_KEY
        sync: false
      - key: THINKING_SPACE_DEV_TOKEN
        sync: false
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: gpt-4o-mini-transcribe
      - key: OPENAI_TIMEOUT_SECONDS
        value: "40"
      - key: MAX_WAV_BYTES
        value: "15728640"
      - key: MAX_REQUESTS_PER_MINUTE
        value: "10"
